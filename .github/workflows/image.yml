name: image

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "backend/**"
      - "frontend/**"
      - "cases/**"
      - ".github/workflows/image.yml"

permissions:
  contents: read

jobs:
  # Builds the public image (D57) and plays CASE #001 against it in Chromium.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t casefile .
      - name: Start
        run: |
          docker run -d --name casefile -p 8000:8000 casefile
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/case >/dev/null && exit 0; sleep 1; done
          docker logs casefile
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser test against the image
        run: npm run e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
      - if: failure()
        run: docker logs casefile
