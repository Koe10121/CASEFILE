name: frontend

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**" # an API change can break the frontend's types
      - "cases/**" # the browser test plays the case
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match the backend
        run: |
          (cd ../backend && uv run --locked casefile-api --openapi ../frontend/openapi.json)
          npm run gen:api
          git diff --exit-code -- openapi.json src/api/schema.d.ts
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build

  # Plays CASE #001 start to finish in Chromium against the real backend, with the mock AI.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: (cd ../backend && uv sync --locked)
      - run: npx playwright install --with-deps chromium
      - name: Browser test
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
